# Route canary : 90 % stable / 10 % canary (poids nginx, équilibre statistique
# sur un volume de requêtes). Un service 5xx est renvoyé tel quel au client :
# c'est le smoke-test qui agrège le taux d'erreur et déclenche le rollback.
worker_processes 1;
events {
  worker_connections 256;
}
http {
  upstream churn_backend {
    server serving-stable:8000 weight=9;
    server serving-canary:8000 weight=1;
  }
  server {
    listen 8080;
    location / {
      proxy_pass http://churn_backend;
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;
    }
  }
}
