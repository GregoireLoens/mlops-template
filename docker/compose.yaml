# Stack locale du template : serveur MLflow (tracking + registre + artefacts).
#
# - backend sqlite par défaut (volume nommé) : zéro dépendance externe, adapté au local ;
# - profil "postgres" : même serveur sur backend postgresql (plus proche de la prod) ;
# - artefacts servis par le serveur (--serve-artifacts) : les clients MLflow passent
#   par HTTP et n'accèdent jamais au disque du serveur — c'est la configuration
#   qui se transpose telle quelle au mode scalable (postgres + S3/MinIO).

name: mlops-template

services:
  mlflow:
    build:
      context: ..
      dockerfile: docker/mlflow/Dockerfile
    image: mlops-template/mlflow:latest
    container_name: mlops-mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri ${MLFLOW_BACKEND_STORE_URI:-sqlite:////mlflow/mlflow.db}
      --serve-artifacts
      --artifacts-destination ${MLFLOW_ARTIFACTS_DESTINATION:-/mlflow/artifacts}
      --allowed-hosts ${MLFLOW_ALLOWED_HOSTS:-localhost,mlflow,127.0.0.1}
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      # curl n'est pas dans l'image MLflow (slim) : healthcheck en python stdlib.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:5000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: mlops-postgres
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow}
      POSTGRES_DB: mlflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 5s
      timeout: 5s
      retries: 12

  # --- Serving canary (profil "serving") : stable 90% / canary 10% via nginx.
  # L'image est surchargée en CD : SERVING_IMAGE=ghcr.io/<org>/mlops-serving:<sha>.
  # Le canary est le MÊME service : on simule sa dégradation avec SERVE_FAILURE=1
  # (la gate smoke-test doit détecter ~10% d'erreurs et le rollback est joué).
  serving-stable:
    build:
      context: ..
      dockerfile: docker/serving/Dockerfile
    image: ${SERVING_IMAGE:-mlops-template/serving:local}
    container_name: mlops-serving-stable
    profiles: ["serving"]
    environment:
      MODEL_NAME: churn-template
      MODEL_ALIAS: prod
      MLFLOW_TRACKING_URI: http://mlflow:5000
      SERVE_FAILURE: ${SERVE_FAILURE_STABLE:-0}
      LOG_INFERENCES: ${LOG_INFERENCES:-true}
    volumes:
      # BP3 : les logs d'inférence JSONL sont lisibles depuis l'hôte
      # (drift_detector, sans docker exec) — même partition par jour.
      - ../data/inferences:/app/data/inferences
    depends_on:
      mlflow:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000" # accès direct stable (baseline du smoke-test)
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  serving-canary:
    build:
      context: ..
      dockerfile: docker/serving/Dockerfile
    image: ${SERVING_IMAGE:-mlops-template/serving:local}
    container_name: mlops-serving-canary
    profiles: ["serving"]
    environment:
      MODEL_NAME: churn-template
      MODEL_ALIAS: prod
      MLFLOW_TRACKING_URI: http://mlflow:5000
      SERVE_FAILURE: ${SERVE_FAILURE_CANARY:-0}
      LOG_INFERENCES: ${LOG_INFERENCES:-true}
    volumes:
      # BP3 : cf. serving-stable — les deux réplicas partagent la partition.
      - ../data/inferences:/app/data/inferences
    depends_on:
      mlflow:
        condition: service_healthy
    ports:
      - "127.0.0.1:8002:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: mlops-nginx
    profiles: ["serving"]
    volumes:
      - ./serving/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - serving-stable
      - serving-canary
    ports:
      - "127.0.0.1:8090:8080" # NB : 8080 peut être occupé par d'autres services locaux
    restart: unless-stopped

  # --- Monitoring BP3 (profil "monitoring") : Prometheus minimaliste qui
  # scrape /metrics des deux réplicas de serving (internes :8001/:8002).
  # L'edge nginx n'expose QUE /predict et /health : /metrics n'est pas
  # routé publiquement (cf. docker/serving/nginx.conf, règle 404 explicite).
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: mlops-prometheus
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

volumes:
  mlflow-data:
  postgres-data:
