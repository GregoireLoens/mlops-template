# Qualité de code : ruff (lint + format), mypy (typage via l'env projet),
# prettier (markdown/yaml/json). `make setup` installe les hooks.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: "^gx/" # stores GX générés par le pipeline : on ne les retouche pas
      - id: end-of-file-fixer
        exclude: "^gx/"
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # mypy depuis .venv : voit les vraies dépendances du projet (pas de dérive
  # de stubs du mirror pre-commit).
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [yaml, json, markdown]
        exclude: '(dvc\.lock$|^gx/)' # fichiers générés (DVC, GX) : pas de reformat
