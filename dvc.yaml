stages:
  # Chaque étape appelle le même code que Dagster (src/) — DVC est la vue
  # "données + cache", Dagster la vue "orchestration", zéro duplication.
  prepare:
    cmd: python -m src.data.prepare
    deps:
      - data/raw
      - src/data/prepare.py
      - src/config.py
    params:
      - data
    outs:
      - data/prepared

  # Gate BP2 : les données douteuses n'atteignent jamais le training.
  # train dépend de `reports` (out de validate) -> l'ordre validate -> train
  # est garanti par le DAG DVC, pas par une convention.
  validate:
    cmd: python -m src.data.validate
    deps:
      - data/raw
      - data/prepared
      - src/data/validate.py
      - src/data/expectations.py
      - src/config.py
    # NB : pas de dep sur gx/ — le store GE est un cache auto-réparé par le
    # stage lui-même (les suites vivent en code dans src/data/expectations.py).
    params:
      - data
      - features
    outs:
      - reports/data_docs # rapport HTML (data docs), versionné via dvc.lock

  train:
    cmd: python -m src.training.train
    deps:
      - data/prepared
      - reports/data_docs # gate : train ne tourne que si validate a produit son rapport
      - src/training/train.py
      - src/config.py
    params:
      - train
      - features
    outs:
      - models # dir : model.pkl + model_card.md (tout le contenu est tracé)
    metrics:
      - metrics.json:
          cache: false # petit fichier commité : `dvc metrics diff` en PR
