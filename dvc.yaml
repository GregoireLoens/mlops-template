stages:
  # Chaque étape appelle le même code que Dagster (src/) — DVC est la vue
  # "données + cache", Dagster la vue "orchestration", zéro duplication.
  prepare:
    cmd: python -m src.data.prepare
    deps:
      - data/raw
      - src/data/prepare.py
      - src/config.py
    params:
      - data
    outs:
      - data/prepared

  # Gate BP2 : les données douteuses n'atteignent jamais le training.
  # train dépend de la sentinelle (out de validate) -> l'ordre validate ->
  # train est garanti par le DAG DVC, pas par une convention. Le rapport HTML
  # (reports/data_docs, horodaté par GE) n'est PAS un out : il ne peut pas
  # être déterministe (cf. ADR-012) — diagnostic local + artefact CI.
  validate:
    cmd: python -m src.data.validate
    deps:
      - data/raw
      - data/prepared
      - src/data/validate.py
      - src/data/expectations.py
      - src/config.py
    # NB : pas de dep sur gx/ — le store GE est un cache auto-réparé par le
    # stage lui-même (les suites vivent en code dans src/data/expectations.py).
    params:
      - data
      - features
    outs:
      - reports/validate.ok # sentinelle de gate verte (déterministe)

  train:
    cmd: python -m src.training.train
    deps:
      - data/prepared
      - reports/validate.ok # gate : train ne tourne que si validate a produit sa sentinelle
      - src/training/train.py
      - src/config.py
    params:
      - train
      - features
    outs:
      - models # dir : model.pkl + model_card.md (tout le contenu est tracé)
    metrics:
      - metrics.json:
          cache: false # petit fichier commité : `dvc metrics diff` en PR
