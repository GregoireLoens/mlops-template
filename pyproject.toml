[project]
name = "mlops-template"
version = "0.1.0"
description = "Template MLOps reproductible : training versionné (DVC, Feast, MLflow, Dagster) + CI/CD modèle (Great Expectations, promotion par alias, canary)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
# Dépendances runtime ajoutées au fil des étapes (2 à 10) : l'historique de
# ce fichier suit la construction du template, étape par étape.
dependencies = [
    "dagster>=1.11,<2",
    "dagster-webserver>=1.11,<2",
    "dvc>=3.60,<4",
    "feast>=0.49,<1",
    "great-expectations>=1.3,<2",
    "matplotlib>=3.9,<4",
    "mlflow>=3.8,<4",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pyyaml>=6.0,<7",
    "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
serving = [
    "fastapi>=0.115,<1",
    "prometheus-client>=0.20,<1",
    "pydantic>=2.9,<3",
    "uvicorn>=0.32,<1",
]
monitoring = [
    "evidently>=0.7,<1",
]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "mypy>=1.14",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src est une racine de namespace (src.data, src.training, ...) : les
# sous-modules s'importent tels quels depuis la racine du repo.
[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
# `uv sync` installe aussi le projet lui-même en mode editable.
package = true
# Dagster 1.13 génère ses parsers avec ANTLR 4.13 (le runtime 4.13 lit aussi
# les grammaires 4.9 d'omegaconf) : override du pin 4.9.* porté par omegaconf.
# ANTLR : dvc->omegaconf fige le runtime 4.9 ; les parsers Dagster générés en
# 4.13 sont incompatibles => on évite le parsing de strings de sélection
# (selection par liste de clés, jamais une string) dans pipelines/.

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "pipelines", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
files = ["src", "pipelines"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
# Pragmatique : les libs MLOps sans stubs (feast, dagster, ...) ne bloquent pas le lint.
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
# Séparation unitaires / intégration : `pytest` n'exécute que les unitaires ;
# `make test-integration` force `-m integration` (les arguments CLI priment
# sur addopts).
addopts = '-m "not integration"'
markers = [
    "integration: pipeline bout-en-bout (DVC repro + validation GE + tests modèle) — lent",
]
